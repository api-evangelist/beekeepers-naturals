aid: beekeepers-naturals
name: Beekeeper's Naturals
description: 'Beekeeper''s Naturals is a direct-to-consumer bee-derived wellness and supplement brand founded
  in 2017 by Carly Stein Kremer, selling propolis throat sprays, B.LXR royal-jelly brain fuel, superfood honey,
  bee pollen and kids'' immunity products through beekeepersnaturals.com and retail partners. The company has no
  traditional developer program, but its Shopify-hosted storefront publishes a genuine machine-readable agent
  surface: a Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, a live MCP endpoint at
  /api/ucp/mcp implementing the UCP Shopping service (catalog search, cart, checkout, order), an agent
  instruction document at /agents.md mirrored to /llms.txt, an agentic-discovery sitemap, OIDC/OAuth discovery
  for Shopify customer accounts, and read-only storefront product/collection JSON endpoints.'
