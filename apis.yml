apis:
- aid: beekeepers-naturals-ucp-shopping-mcp
  name: Beekeeper's Naturals UCP Shopping MCP API
  description: 'Agent-facing commerce API for the Beekeeper''s Naturals storefront, exposed over the Model
    Context Protocol as the Universal Commerce Protocol (UCP) Shopping service. The endpoint is advertised by
    the store''s own /.well-known/ucp merchant profile and /agents.md, and implements catalog search and
    lookup, cart create/get/update/cancel, checkout create/get/update/complete/cancel, and order retrieval.
    Requests must carry a UCP-Agent profile; checkout completion requires explicit contemporaneous buyer
    approval and an idempotency key.'
  humanURL: https://www.beekeepersnaturals.com/agents.md
  baseURL: https://www.beekeepersnaturals.com/api/ucp/mcp
  tags:
  - Agentic Commerce
  - MCP
  - Checkout
  - Catalog
  properties:
  - type: MCPServer
    url: mcp/beekeepers-naturals-mcp.yml
  - type: ToolCrosswalk
    url: mcp/beekeepers-naturals-tool-crosswalk.yml
- aid: beekeepers-naturals-storefront-json
  name: Beekeeper's Naturals Storefront Product JSON
  description: 'Read-only JSON representations of the Beekeeper''s Naturals storefront catalog, documented by
    the store''s own agent instructions: product detail at /products/{handle}.json and collection listings at
    /collections/{handle}/products.json. No authentication is required. Shopify''s standard storefront JSON
    surface, published by this merchant for agents that only need to read catalog data without transacting.'
  humanURL: https://www.beekeepersnaturals.com/collections/all
